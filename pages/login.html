<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ログイン｜就活AI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>
  <div class="auth-page">
    <header class="auth-header">
      <a href="../index.html" class="auth-back" aria-label="戻る">
        <i class="ti ti-arrow-left"></i>
      </a>
      <h1 class="auth-title">ログイン</h1>
    </header>

    <main class="auth-main">
      <div class="auth-card">
        <div class="auth-logo">
          <i class="ti ti-robot"></i>
          就活AI
        </div>
        <p class="auth-subtitle">IDとパスワードでログイン</p>

        <div class="auth-field">
          <label for="loginId">ID</label>
          <input type="text" id="loginId" placeholder="例：kyusan2026" autocomplete="username" />
        </div>

        <div class="auth-field">
          <label for="password">パスワード</label>
          <input type="password" id="password" placeholder="6文字以上" autocomplete="current-password" />
        </div>

        <button id="loginBtn" class="auth-submit">
          <i class="ti ti-login"></i>
          ログイン
        </button>

        <p id="errorMsg" class="auth-error" style="display:none"></p>

        <div class="auth-switch">
          アカウントをお持ちでない方は
          <a href="signup.html">新規登録</a>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script>
    const loginIdInput = document.getElementById('loginId');
    const passwordInput = document.getElementById('password');
    const loginBtn     = document.getElementById('loginBtn');
    const errorMsg     = document.getElementById('errorMsg');

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
    }

    function hideError() {
      errorMsg.style.display = 'none';
    }

    loginBtn.addEventListener('click', async () => {
      hideError();

      const loginId  = loginIdInput.value.trim();
      const password = passwordInput.value;

      if (!loginId || !password) {
        showError('IDとパスワードを入力してください');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="ti ti-loader"></i> ログイン中...';

      const result = await authLogin(loginId, password);

      if (result && result.status === 'ok') {
        // role によって遷移先を分岐
        if (result.account.role === 'career_staff') {
          window.location.href = 'staff.html';
        } else {
          window.location.href = 'chat.html';
        }
      } else {
        showError(result?.error || 'ログインに失敗しました');
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="ti ti-login"></i> ログイン';
      }
    });

    passwordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loginBtn.click();
    });
  </script>
</body>
</html>
